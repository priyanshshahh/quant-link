name: CI

on:
  push:
    branches: [main, prod-hardening]
  pull_request:

jobs:
  server:
    name: Rust module (test + wasm build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable + wasm32 target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            server/target
          key: cargo-${{ runner.os }}-${{ hashFiles('server/Cargo.toml') }}

      - name: Unit tests (native — GBM / RNG / firm math)
        run: cargo test --lib

      - name: Build module for its real target (wasm32)
        run: cargo build --release --target wasm32-unknown-unknown

  client:
    name: Client build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check + production build
        run: npm run build
